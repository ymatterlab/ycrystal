[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ycrystal"
dynamic = ["version"]
description = "Prepare reproducible crystal-structure figures and render them with POV-Ray"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Y-Matter Lab" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Lower bounds only; the integration-tested set is pinned in constraints.txt.
dependencies = [
    "PySide6-Essentials>=6.7",
    "vtk>=9.3",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "ase>=3.23",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pre-commit>=4"]
# Documentation site (Zensical + mkdocstrings); static analysis only, no Qt/VTK needed.
docs = ["zensical>=0.1.1", "mkdocstrings-python>=2.0.11"]

[project.urls]
Repository = "https://github.com/ymatterlab/ycrystal"

[project.scripts]
ycrystal = "ycrystal.app:main"

[tool.setuptools.dynamic]
version = { attr = "ycrystal.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Preset manifests and their POV-Ray thumbnails ship with the package.
"ycrystal.presets" = [
    "materials/*.json",
    "environments/*.json",
    "lighting.json",
    "thumbnails/index.json",
    "thumbnails/materials/*.png",
    "thumbnails/environments/*.png",
]
"ycrystal.resources" = [
    "*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "povray: needs a working POV-Ray executable (skipped otherwise)",
    "gui: needs a display with OpenGL (skipped otherwise)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# D: enable docstring checks explicitly; NumPy disables conflicting layout rules.
select = ["E", "F", "W", "I", "B", "UP", "D"]
# D105: magic methods (__len__, __contains__) are self-explanatory.
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests and helper scripts: no docstrings demanded for each function or class.
"tests/**" = ["D"]
"scripts/**" = ["D101", "D102", "D103"]
# Qt overrides (showEvent, closeEvent, undo/redo) and dialog helpers in the interface
# layer need no method docstrings; public classes and functions still do.
"src/ycrystal/gui/**" = ["D102"]

[tool.ruff.format]
# Format code in docstring examples like other code.
docstring-code-format = true
