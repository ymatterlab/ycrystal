name: CI

# Pushes to main and pull requests (a pushed PR branch is tested once, via its PR).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    # Same hooks as local `pre-commit run --all-files`. Lightweight:
    # installs only pre-commit (pinned in constraints.txt), not Qt/VTK or POV-Ray.
    name: pre-commit (lint, format, file checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install pre-commit
        run: python -m pip install pre-commit -c constraints.txt

      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  docs:
    name: docs (static API reference and strict links)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools only (no application dependencies)
        run: python -m pip install -r docs/requirements.txt

      - name: Build with strict reference and link validation
        run: zensical build --clean --strict

  test:
    # Integration baseline: Ubuntu 24.04, Python 3.12, real Qt/VTK under Xvfb, and the
    # distribution's POV-Ray 3.7. YCRYSTAL_REQUIRE_INTEGRATION makes a missing display or
    # renderer fail the run instead of skipping the GUI and rendering tests.
    name: tests (Ubuntu 24.04, Python 3.12, Xvfb, POV-Ray 3.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YCRYSTAL_POVRAY: /usr/bin/povray
      YCRYSTAL_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - name: System packages (POV-Ray 3.7 with its standard include files, Qt xcb, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends povray povray-includes xvfb \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libegl1 libgl1 libdbus-1-3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install (integration-tested pins from constraints.txt)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Renderer check
        run: ycrystal --check-renderer --povray /usr/bin/povray

      - name: Display-independent documentation examples
        run: |
          python -m doctest src/ycrystal/core/structure.py src/ycrystal/core/scene.py src/ycrystal/core/colors.py src/ycrystal/core/aspect.py src/ycrystal/core/lighting.py src/ycrystal/core/camera.py src/ycrystal/core/picking.py src/ycrystal/io/readers.py src/ycrystal/io/project.py src/ycrystal/io/style.py src/ycrystal/presets/__init__.py src/ycrystal/render/jobs.py src/ycrystal/render/thumbnails.py src/ycrystal/batch.py src/ycrystal/desktop.py
          python scripts/docs_examples.py

      - name: Tests (GUI under Xvfb)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -rs
