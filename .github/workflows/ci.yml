name: CI

# Pushes to main and pull requests (a pushed PR branch is tested once, via its PR).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    # Same hooks as local `pre-commit run --all-files`. Lightweight:
    # installs only pre-commit (pinned in constraints.txt), not Qt/VTK or POV-Ray.
    name: pre-commit (lint, format, file checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install pre-commit
        run: python -m pip install pre-commit -c constraints.txt

      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  docs:
    name: docs (static API reference and strict links)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools only (no application dependencies)
        run: python -m pip install -r docs/requirements.txt

      - name: Build with strict reference and link validation
        run: zensical build --clean --strict

  test:
    # One job per operating system, same steps, on Python 3.12 (the version the pins in
    # constraints.txt were tested with), plus Python 3.13 and 3.14 on Ubuntu only: the
    # full suite there costs two jobs, against six for every system. To add a system,
    # add a matrix entry and a "System packages" step for it; POV-Ray must be on PATH,
    # except POV-Ray for Windows, which Ycrystal finds in its installation folder.
    # YCRYSTAL_REQUIRE_INTEGRATION makes a missing display or renderer fail the run
    # instead of skipping the GUI and rendering tests.
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Integration baseline: real Qt/VTK under Xvfb (software OpenGL) and the
          # distribution's POV-Ray 3.7. Runs every test.
          - name: Ubuntu 24.04, Python 3.12, Xvfb, POV-Ray 3.7
            os: ubuntu-24.04
            python: "3.12"
            pytest: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -rs
          # The newer supported Pythons, with the same pins and every test.
          - name: Ubuntu 24.04, Python 3.13, Xvfb, POV-Ray 3.7
            os: ubuntu-24.04
            python: "3.13"
            pytest: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -rs
          - name: Ubuntu 24.04, Python 3.14, Xvfb, POV-Ray 3.7
            os: ubuntu-24.04
            python: "3.14"
            pytest: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -rs
          # macOS on Apple silicon with Homebrew's POV-Ray 3.7: installation, imports,
          # structure and project code, POV-Ray discovery and rendering, and Qt without
          # windows (QProcess, QSettings). The GUI tests are left out: hosted macOS
          # runners have no GPU, and Qt's OpenGL widget is unreliable on Apple's software
          # renderer. Run them on a real Mac (docs/HANDOFF.md).
          - name: macOS 15 arm64, Python 3.12, POV-Ray 3.7, no GUI tests
            os: macos-15
            python: "3.12"
            pytest: python -m pytest -q -rs -m "not gui"
          # Windows with the official POV-Ray for Windows 3.7, from this repository's
          # "ci-assets" release (povray.org refuses downloads from runners). The GUI
          # tests are left out, as on macOS: they run on a real Windows computer.
          - name: Windows Server 2022, Python 3.12, POV-Ray for Windows 3.7, no GUI tests
            os: windows-2022
            python: "3.12"
            pytest: python -m pytest -q -rs -m "not gui"
    defaults:
      run:
        shell: bash
    env:
      YCRYSTAL_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - name: System packages (Linux; POV-Ray 3.7 with its include files, Qt xcb, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends povray povray-includes xvfb \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libegl1 libgl1 libdbus-1-3

      - name: System packages (macOS; Homebrew POV-Ray 3.7, include files included)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install povray

      - name: System packages (Windows; POV-Ray for Windows 3.7, official installer)
        if: runner.os == 'Windows'
        uses: ./.github/actions/povray-windows

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install (integration-tested pins from constraints.txt)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: How POV-Ray for Windows behaves (diagnostics; also its first start)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/windows_povray_probe.py --timeout 60 --screenshots probe-screenshots

      - name: Screenshots of POV-Ray for Windows waiting (if any)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: povray-windows-probe
          path: probe-screenshots/
          if-no-files-found: ignore

      - name: Command line and renderer check (POV-Ray found)
        timeout-minutes: 10
        run: |
          ycrystal --version
          if [ "$RUNNER_OS" != "Windows" ]; then command -v povray; fi
          ycrystal --check-renderer

      - name: Display-independent documentation examples
        run: |
          python -m doctest src/ycrystal/core/structure.py src/ycrystal/core/scene.py src/ycrystal/core/colors.py src/ycrystal/core/aspect.py src/ycrystal/core/lighting.py src/ycrystal/core/measure.py src/ycrystal/core/vectors.py src/ycrystal/core/background.py src/ycrystal/presets/custom.py src/ycrystal/core/camera.py src/ycrystal/core/picking.py src/ycrystal/io/readers.py src/ycrystal/io/project.py src/ycrystal/io/style.py src/ycrystal/presets/__init__.py src/ycrystal/render/jobs.py src/ycrystal/render/povray.py src/ycrystal/render/thumbnails.py src/ycrystal/batch.py src/ycrystal/provenance.py src/ycrystal/desktop.py src/ycrystal/gui/native.py src/ycrystal/core/export.py src/ycrystal/render/formats.py
          python scripts/docs_examples.py

      - name: Tests
        run: ${{ matrix.pytest }}

      # The installation script of the install guide, in Windows PowerShell 5.1 as on a
      # new Windows 11, into a new .venv: Ycrystal, the Start-menu entry, the renderer
      # check. Python comes from setup-python ("py -3.12" is not guaranteed on runners),
      # and POV-Ray for Windows is already installed (povray.org refuses runners).
      - name: Installation script (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1 -Python "$env:pythonLocation\python.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -c "from ycrystal.windows_shortcut import programs_folder, read_shortcut; print(read_shortcut(programs_folder() / 'Ycrystal (development).lnk'))"
