name: Windows installer

# Builds the graphical Windows installer (PyInstaller + Inno Setup) and checks it next
# to an installation from source. Runs when the packaged program or its build can have
# changed; the installer is kept as a run artifact (it is attached to a release by hand,
# docs/development/release.md).
on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - "src/**"
      - "pyproject.toml"
      - "constraints.txt"
      - "scripts/install-windows.ps1"
      - ".github/actions/povray-windows/**"
      - ".github/workflows/windows-installer.yml"
  push:
    branches: [main]
    paths:
      - "packaging/windows/**"
      - "src/**"
      - "pyproject.toml"
      - "constraints.txt"
      - "scripts/install-windows.ps1"
      - ".github/actions/povray-windows/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  installer:
    name: build and check (Windows Server 2022)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell  # Windows PowerShell 5.1, as on a user's computer
    steps:
      - uses: actions/checkout@v7

      - name: POV-Ray for Windows 3.7
        uses: ./.github/actions/povray-windows

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            packaging/windows/requirements.txt

      - name: Inno Setup 6
        run: |
          # Preinstalled on GitHub's Windows images; installed with Chocolatey otherwise.
          $key = "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $key)) {
            choco install innosetup --no-progress -y
          }

      - name: Build (packaging\windows\build.ps1)
        timeout-minutes: 30
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Python "$env:pythonLocation\python.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The packaged command line renders with POV-Ray for Windows
        timeout-minutes: 5
        run: |
          dist\windows\Ycrystal\ycrystal-cli.exe --check-renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\windows\Ycrystal\ycrystal-cli.exe examples\SrTiO3-studio.ycrystal --width 160 --height 120 --render "$env:RUNNER_TEMP\packaged.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source installation next to it (scripts\install-windows.ps1)
        timeout-minutes: 15
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1 -Python "$env:pythonLocation\python.exe" -NoStartMenu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Coexistence (packaging\windows\coexistence-check.ps1)
        timeout-minutes: 10
        run: |
          $setup = (Get-ChildItem dist\windows\Ycrystal-*-windows-x64-setup.exe).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\coexistence-check.ps1 -Setup $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: ycrystal-windows-installer
          path: dist/windows/Ycrystal-*-windows-x64-setup.exe
          retention-days: 14
          if-no-files-found: error
